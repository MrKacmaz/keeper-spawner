name: Feature request / Özellik isteği
description: Suggest an idea or an improvement. / Bir fikir ya da iyileştirme öner.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like? / Ne istersin?
      description: Describe the feature and how you would use it. / Özelliği ve nasıl kullanacağını anlat.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why? / Neden?
      description: What problem does it solve, or what is hard today? / Hangi sorunu çözer, bugün ne zor?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Alternatifler
      description: Other ways you thought about, or other mods that do it. / Düşündüğün başka yollar ya da bunu yapan başka modlar.
